# =========================================================
#  PAW — Perfil DEV
#  Ajusta usuario/contraseña/schema a tu entorno local
# =========================================================

# --- DataSource MySQL ------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/paw_veterinaria?useSSL=false&serverTimezone=Europe/Madrid&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Connection Pool (HikariCP) --------------------------
spring.datasource.hikari.pool-name=PawPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- SQL init (ejecutar schema + data en arranque) -------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Thymeleaf (hot-reload en dev) -----------------------
spring.thymeleaf.cache=false

# --- DevTools --------------------------------------------
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# --- Server ----------------------------------------------
server.port=8080
server.servlet.context-path=/

# --- Logging detallado en dev ----------------------------
logging.level.com.paw=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
